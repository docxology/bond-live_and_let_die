# Experiment plan — LIVE AND LET DIE / SAN MONIQUE (advisory, declarative)

# Declares the analysis conditions, primary metrics, and expected outputs.

conditions:
  supply_graph:
    nodes: 7
    edges: 10
    sources: ["poppy_fields"]
    markets: ["miami", "new_york"]
  interdiction:
    budget: 3
    severable: "all real transit legs"
  coded_comms:
    keyword: "BARON"
    alphabet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ"
  drum_code:
    message: "KANANGA LETS THE SNAKE BITE"
    timing: "Morse (1/3 symbols, 1/3/7 gaps)"
  market_flow:
    farm_gate_price: 300
    retail_markup: 3.0
    retail_dilution: 0.75
  island_ops:
    grid: "9x9"
    start: [8, 1]
    goal: [0, 4]
    terrain: ["road", "open", "beach", "mangrove", "swamp", "open water", "crocodile water", "cliff"]

primary_metrics:
  - "shortest production->market path cost"
  - "max flow / min cut value"
  - "critical transit node and disruption units"
  - "interdiction reduction (greedy and optimal) and cost-effectiveness"
  - "deciphered communiqué plaintext"
  - "drum signal length, density, round-trip exactness"
  - "producer share, price-spread ratio, gross revenue"
  - "infiltration route cost and crocodile-water cells"

expected_figures:
  - "supply graph (route + bottleneck)"
  - "interdiction trade-off curve"
  - "island route over terrain"
