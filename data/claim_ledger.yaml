# Claim ledger — LIVE AND LET DIE / SAN MONIQUE
# Registers sourced numeric claims for evidence-registry validation. All
# values are generated deterministically by the code, never hand-authored.

claims:
  - id: "supply-max-flow"
    description: "Maximum narcotics throughput from production to market"
    value: 220
    source: "src/live_and_let_die/supply_graph.py::analyze_san_monique -> max_flow_total"
  - id: "supply-min-cut"
    description: >-
      Minimum cut bounding total throughput. NOT a target list: the cut lies
      entirely on virtual market-demand edges (0 physical legs), so the network
      is demand-limited and the cut names no severable asset.
    value: 220
    source: "src/live_and_let_die/supply_graph.py::analyze_san_monique -> min_cut_value"
  - id: "supply-min-cut-physical-legs"
    description: "Physical (severable) supply legs appearing in the minimum cut"
    value: 0
    source: "src/live_and_let_die/supply_graph.py::analyze_san_monique -> min_cut_physical_edges"
  - id: "supply-critical-node"
    description: >-
      Highest-value interdiction target (transit node), from the per-node
      disruption probe on the demand-capped flow graph — not from the min cut.
    value: "airfield"
    source: "src/live_and_let_die/supply_graph.py::analyze_san_monique -> critical_transit_node"
  - id: "supply-disruption"
    description: >-
      Demand-capped network throughput (of 220 total) lost by neutralizing the
      critical node. Measured on the same SUPPLY->DEMAND flow graph as
      supply-max-flow, so it is bounded by it.
    value: 110
    source: "src/live_and_let_die/supply_graph.py::analyze_san_monique -> disruption_units"
  - id: "comms-plaintext"
    description: "Deciphered voodoo communiqué"
    value: "KANANGA LETS THE SNAKE BITE"
    source: "src/live_and_let_die/coded_comms.py::SAN_MONIQUE_PLAINTEXT"
  - id: "ops-route-cost"
    description: "Infiltration route total cost"
    value: 41
    source: "src/live_and_let_die/island_ops.py::plan_san_monique_route -> cost"
  - id: "ops-crocodile-cells"
    description: "Crocodile-water cells crossed by the cheapest infiltration route"
    value: 4
    source: "src/live_and_let_die/island_ops.py::plan_san_monique_route -> crocodile_cells"
  - id: "ops-min-crocodile-cells"
    description: >-
      Minimum crocodile-water cells over ALL beach-to-airfield routes. This, not
      ops-crocodile-cells, is what supports the universal claim that any
      overland approach must wade at least this many.
    value: 4
    source: "src/live_and_let_die/island_ops.py::min_san_monique_crocodile_exposure"
  - id: "interdict-reduction"
    description: "Optimal 3-leg interdiction throughput reduction"
    value: 220
    source: "src/live_and_let_die/interdiction.py::interdict_san_monique -> exact.reduction"
  - id: "interdict-top-target"
    description: "Highest-value single target leg"
    value: "field_works -> harbor"
    source: "src/live_and_let_die/interdiction.py::interdict_san_monique -> efficiency_ranking[0]"
  - id: "drum-beats"
    description: "Beat length of the canonical voodoo drum message"
    value: 195
    source: "src/live_and_let_die/voodoo_drums.py::drum_report -> beats"
  - id: "market-producer-share"
    description: >-
      Farm-gate producer share of street value. SCENARIO OUTPUT, NOT AN
      ESTIMATE: every economic parameter (FARM_GATE_PRICE, RETAIL_MARKUP,
      RETAIL_DILUTION, all ten EDGE_ECONOMICS pairs) is invented for this
      fictional case and fitted to no data. Do not compare to empirical figures.
    value: 0.017
    source: "src/live_and_let_die/market_flow.py::market_flow_report -> producer_share"
  - id: "market-revenue"
    description: "Gross per-market revenue (USD) — scenario output on invented parameters"
    value: 3888000
    source: "src/live_and_let_die/market_flow.py::market_flow_report -> total_revenue"
  - id: "comms-frequency-attack-failure"
    description: >-
      The unkeyed frequency attack does NOT recover the canonical intercept: on
      27 characters it returns this garbage candidate while scoring 0.926
      against the English reference. Recorded so the score is never read as
      evidence of recovery.
    value: "IEAEAHE LTON ORT NAEIT SDOT"
    source: "src/live_and_let_die/coded_comms.py::solve_substitution"
