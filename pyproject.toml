# LIVE AND LET DIE — SAN MONIQUE · PROJECT BOND film package (Phase 2)
# Inherits workspace settings from root pyproject.toml.

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "live_and_let_die"
version = "0.1.0"
license = {text = "MIT"}
description = "LIVE AND LET DIE (1973) — SAN MONIQUE special-agent mission software: narcotics supply-graph analytics and budgeted network interdiction, voodoo-coded communiqué and drum-code deciphering, farm-gate-to-street market economics, and Caribbean island ops planning."
authors = [
    {name = "Daniel Ari Friedman", email = "daniel@activeinference.institute"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "bond-api",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0",
]

[tool.uv.sources]
# Local path dependency: the FROZEN bond-api MissionProvider protocol (Layer 1).
# bond-api is phase-1 complete and frozen; film providers code against it.
bond-api = { path = "/Users/4d/Documents/GitHub/template/projects/working/bond/bond-api" }

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[tool.coverage.run]
source = ["src"]
branch = true
omit = [
    "tests/*",
    "*/__init__.py",
    "*/test_*.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.mypy]
# Project-local mypy (the monorepo root has no mypy_path for this src/ layout).
python_version = "3.12"
mypy_path = ["src"]
explicit_package_bases = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.uv]
# Inherits workspace settings from root pyproject.toml.
